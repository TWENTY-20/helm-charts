{{- if .Values.ingress.enabled }}
{{- $annotations := default (dict) .Values.ingress.annotations }}
{{- $hosts := default (list) .Values.ingress.hosts }}
{{- $tlsEntries := default (list) .Values.ingress.tls }}
{{- if eq (len $hosts) 0 }}
{{- fail "ingress.hosts must contain at least one entry when ingress.enabled=true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name }}
  namespace: {{ .Release.Namespace }}
  {{- with $annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  rules:
    {{- range $host := $hosts }}
    {{- if not $host.host }}
    {{- fail "each ingress.hosts entry needs a host value" }}
    {{- end }}
    {{- if contains "example.com" $host.host }}
    {{- fail (printf "ingress.hosts contains example host %q; replace it with your real YouTrack hostname before enabling ingress" $host.host) }}
    {{- end }}
    {{- $paths := default (list) $host.paths }}
    {{- if eq (len $paths) 0 }}
    {{- fail "each ingress.hosts entry needs at least one path" }}
    {{- end }}
    - host: {{ $host.host | quote }}
      http:
        paths:
          {{- range $path := $paths }}
          {{- if not $path.path }}
          {{- fail "each ingress.hosts[].paths entry needs a path value" }}
          {{- end }}
          - path: {{ $path.path }}
            pathType: {{ default "Prefix" $path.pathType }}
            backend:
              service:
                name: {{ $.Values.service.name }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
  {{- if gt (len $tlsEntries) 0 }}
  tls:
    {{- range $tls := $tlsEntries }}
    {{- if not $tls.secretName }}
    {{- fail "each ingress.tls entry needs secretName" }}
    {{- end }}
    {{- if eq $tls.secretName "youtrack-letsencrypt-cert" }}
    {{- fail "ingress.tls contains example secretName \"youtrack-letsencrypt-cert\"; replace it with your real TLS secret name before enabling ingress" }}
    {{- end }}
    - secretName: {{ $tls.secretName }}
      {{- $tlsHosts := default (list) $tls.hosts }}
      {{- if gt (len $tlsHosts) 0 }}
      hosts:
        {{- range $tlsHost := $tlsHosts }}
        {{- if contains "example.com" $tlsHost }}
        {{- fail (printf "ingress.tls.hosts contains example host %q; replace it with your real TLS hostname before enabling ingress" $tlsHost) }}
        {{- end }}
        - {{ $tlsHost | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
